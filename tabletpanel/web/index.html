<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Mac Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="glow" id="glow-a"></div>
    <div class="glow" id="glow-b"></div>
  </div>
  <div id="shell" class="shell no-spotify">
    <main id="windows" class="windows">
      <div id="stage" class="stage">
        <div id="lamp" class="lamp" aria-hidden="true"></div>
        <div id="grid" class="grid"></div>
      </div>
    </main>
    <aside id="spotify" class="spotify"></aside>
  </div>
  <div id="layer" class="layer" hidden>
    <div id="layer-backdrop" class="layer-backdrop"></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <img id="sheet-icon" class="sheet-icon" alt="">
        <div class="sheet-names">
          <h2 id="sheet-title"></h2>
          <p id="sheet-sub"></p>
        </div>
        <button id="sheet-close" class="sheet-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="cards" class="cards"></div>
    </section>
  </div>
  <div id="overlay" class="overlay" hidden>Reconnecting to your Mac…</div>
  <div id="dot" class="dot"></div>
  <div id="sleep" class="sleep" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
