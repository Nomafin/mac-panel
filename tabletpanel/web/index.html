<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Mac Panel</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/pad.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/status.css">
  <link rel="stylesheet" href="css/music.css">
  <link rel="stylesheet" href="css/sheet.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="glow" id="glow-a"></div>
    <div class="glow" id="glow-b"></div>
  </div>
  <div id="pages" class="pages">
  <div class="page">
  <div id="shell" class="shell no-spotify">
    <main id="windows" class="windows">
      <div id="stage" class="stage">
        <header id="clock" class="clock">
          <span id="clock-time" class="clock-time"></span>
          <span id="clock-date" class="clock-date"></span>
          <span id="battery" class="battery" hidden><span class="batt-icon"><i></i></span><span class="pct"></span><span class="trend"></span></span>
          <button id="mic" class="mic" hidden aria-label="Mute microphone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path class="slash" d="M4 4l16 16"/></svg>
          </button>
        </header>
        <div id="lamp" class="lamp" aria-hidden="true"></div>
        <div id="grid" class="grid"></div>
      </div>
      <nav id="actions" class="actions" aria-label="Shortcuts for the front app"></nav>
      <footer id="macstat" class="macstat"></footer>
    </main>
    <aside id="spotify" class="spotify"></aside>
  </div>
  </div>
  <section id="map-page" class="page map-page" aria-label="Screens">
    <div id="map" class="map"></div>
    <div id="map-tools" class="map-tools"></div>
  </section>
  <section id="pad-page" class="page pad-page" aria-label="Sketch pad">
    <canvas id="pad" class="pad"></canvas>
    <p id="pad-hint" class="pad-hint">Draw or sign with your finger, then copy it to the Mac's clipboard.</p>
    <div class="pad-tools">
      <button id="pad-undo" class="pad-btn">Undo</button>
      <button id="pad-clear" class="pad-btn">Clear</button>
      <button id="pad-copy" class="pad-btn primary">Copy to Mac</button>
    </div>
    <div id="pad-toast" class="pad-toast" hidden></div>
  </section>
  </div>
  <nav id="page-dots" class="page-dots" aria-label="Pages">
    <button data-page="0" aria-label="Panel"></button>
    <button data-page="1" aria-label="Screens"></button>
    <button data-page="2" aria-label="Sketch pad"></button>
  </nav>
  <div id="layer" class="layer" hidden>
    <div id="layer-backdrop" class="layer-backdrop"></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <img id="sheet-icon" class="sheet-icon" alt="">
        <div class="sheet-names">
          <h2 id="sheet-title"></h2>
          <p id="sheet-sub"></p>
        </div>
        <button id="sheet-close" class="sheet-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="cards" class="cards"></div>
    </section>
  </div>
  <div id="overlay" class="overlay" hidden>Reconnecting to your Mac…</div>
  <div id="dot" class="dot"></div>
  <div id="sleep" class="sleep" aria-hidden="true"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
